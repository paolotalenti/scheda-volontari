{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Cambia Password</h1>

    <div class="card" style="max-width: 480px;">
        <div class="card-body">
            <form method="post">
                <div class="mb-3">
                    <label for="password_attuale" class="form-label">Password attuale</label>
                    <input type="password" class="form-control" id="password_attuale" name="password_attuale" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="nuova_password" class="form-label">Nuova password</label>
                    <input type="password" class="form-control" id="nuova_password" name="nuova_password" required>
                </div>
                <div class="mb-3">
                    <label for="conferma_password" class="form-label">Conferma nuova password</label>
                    <input type="password" class="form-control" id="conferma_password" name="conferma_password" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salva</button>
                    <a href="{{ url_for('report') }}" class="btn btn-secondary">Annulla</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
